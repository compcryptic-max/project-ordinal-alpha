name: ProjectOrdinal
options:
  bundleIdPrefix: com.projectordinal
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ProjectOrdinal:
    type: application
    platform: iOS
    sources:
      - path: native-ios
        excludes:
          - README.md
          - TESTFLIGHT-CHECKLIST.md
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectordinal.game
        PRODUCT_NAME: Project Ordinal
        MARKETING_VERSION: "0.20.0"
        CURRENT_PROJECT_VERSION: "20"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Project Ordinal
        INFOPLIST_KEY_NSCameraUsageDescription: Project Ordinal uses the camera only when you open the Veil Lens to place game encounters in your surroundings.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Project Ordinal uses location while you play to align the Field with real streets, measure walking distance to contacts, and select your persistent world region. Apple Maps uses your location for map and park searches; only a coarse region is sent to the game server.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
