<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b10"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.webmanifest"><title>Project Ordinal — Hosted Alpha</title><style>
:root{color-scheme:dark;--bg:#080b10;--panel:#111722;--line:#273142;--text:#f2f5fa;--muted:#93a1b4;--red:#d16c73;--green:#76b08d;--gold:#d0ad68;--violet:#9384d1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#1a2435,#080b10 43%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.shell{max-width:760px;margin:auto;padding:14px 12px 88px}.top{display:flex;justify-content:space-between;gap:12px;padding:10px 2px 16px}.eyebrow{font:700 10px ui-monospace,monospace;letter-spacing:.15em;color:var(--muted)}h1,h2,p{margin:0}.top h1{font-size:28px;letter-spacing:-.04em}.sub,.muted{color:var(--muted)}.sub{font-size:13px;margin-top:5px}.chip{border:1px solid var(--line);background:#0c1118;border-radius:99px;padding:6px 9px;font-size:11px}.panel{background:linear-gradient(180deg,#141b27f7,#0e131cf7);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:12px;box-shadow:0 18px 50px #0004}.map{height:320px;position:relative;overflow:hidden;padding:0;background:radial-gradient(circle at 70% 25%,#27304488,transparent 28%),linear-gradient(145deg,#131b27,#0b1017)}.map:after{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:44px 44px}.road{position:absolute;height:2px;background:#59647755;width:120%;left:-10%;top:58%;transform:rotate(-13deg)}.road.two{top:35%;transform:rotate(22deg)}.node{position:absolute;z-index:2;text-align:center;transform:translate(-50%,-50%);font-size:10px;font-weight:800;text-transform:uppercase}.orb{margin:auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid #ffffff55;box-shadow:0 0 0 10px #ffffff08}.you{left:22%;top:72%}.you .orb{background:#73a9b5}.town{left:43%;top:57%}.town .orb{background:var(--gold);border-radius:8px}.signal{left:68%;top:35%}.signal .orb{background:var(--violet);animation:p 2s infinite}.shrine{left:81%;top:65%}.shrine .orb{background:#68758c}@keyframes p{50%{box-shadow:0 0 0 20px #9384d100}}.mapstats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}.stat{padding:11px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.stat b{font-size:17px}.head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}.head h2{font-size:18px}.body{font-size:14px;line-height:1.55}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{min-height:45px;border:1px solid var(--line);background:#171e2a;color:var(--text);border-radius:13px;padding:10px 14px;font-weight:750}.btn.primary{background:#eef2f9;color:#10141b;border-color:#eef2f9}.btn.danger{background:#28171c;border-color:#5d323c}.origin-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.origin.active{outline:2px solid #e9eef8;background:#202a39}.form{display:grid;gap:6px;margin:12px 0}.form input{height:47px;border:1px solid var(--line);background:#0b1017;color:white;border-radius:12px;padding:0 12px}.meterline{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.bar{height:8px;background:#090d13;border-radius:20px;overflow:hidden;margin:5px 0 12px}.fill{height:100%;background:var(--green)}.fill.xp{background:var(--violet)}.fill.enemy{background:var(--red)}.feed{display:grid;gap:7px}.entry,.item{background:#0c121a;border:1px solid #202938;border-radius:12px;padding:10px;font-size:13px}.item{display:flex;justify-content:space-between;gap:8px}.rarity{color:var(--gold);font-size:10px;letter-spacing:.08em}.bottom{position:fixed;bottom:0;left:0;right:0;border-top:1px solid var(--line);background:#080b10ed;backdrop-filter:blur(15px);padding:8px 12px max(8px,env(safe-area-inset-bottom))}.nav{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.nav button{border:0;background:transparent;color:var(--muted);height:45px;border-radius:11px;font-weight:700}.nav button.active{background:#161e29;color:#fff}@media(max-width:520px){.map{height:300px}.top h1{font-size:24px}}
</style></head><body><div id="app"></div><script type="module">
const SK="ordinal-session",PK="ordinal-player";let sid=localStorage.getItem(SK),pk=localStorage.getItem(PK),state=null,origin="Rogue",tab="world",notice="",presence=[];
const esc=(v="")=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct=(a,b)=>Math.max(0,Math.min(100,Math.round(a/b*100)));
async function api(path,opt={}){const r=await fetch(path,{method:opt.method||"GET",headers:opt.body?{"content-type":"application/json"}:undefined,body:opt.body?JSON.stringify(opt.body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||"server_error");return j}
async function shared(){if(!sid)return;try{presence=(await api("/api/session/"+sid+"/presence")).players||[]}catch{presence=[]}}
async function restore(){if(!sid)return;try{state=(await api("/api/session/"+sid)).state;await shared()}catch{localStorage.removeItem(SK);sid=null}}
function geo(){return new Promise(resolve=>{if(!window.isSecureContext||!navigator.geolocation)return resolve(null);navigator.geolocation.getCurrentPosition(p=>resolve({lat:p.coords.latitude,lon:p.coords.longitude}),()=>resolve(null),{enableHighAccuracy:false,timeout:6000,maximumAge:300000})})}
async function start(){if(!pk){pk=crypto.randomUUID();localStorage.setItem(PK,pk)}const g=await geo();const j=await api("/api/session",{method:"POST",body:{playerKey:pk,playerName:(document.querySelector("#name")?.value||"Wayfarer").slice(0,18),origin,...(g||{})}});sid=j.sessionId;pk=j.playerKey;state=j.state;localStorage.setItem(SK,sid);localStorage.setItem(PK,pk);await shared();tab="world"}
async function act(a,b={}){const j=await api("/api/session/"+sid+"/"+a,{method:"POST",body:b});state=j.state;await shared()}
function startView(){return '<main class="shell"><div class="eyebrow">PROJECT ORDINAL // HOSTED ALPHA</div><h1 style="font-size:36px;margin:8px 0">Enter a living world.</h1><p class="body muted">Your real area becomes a coarse fantasy region. Exact coordinates are used only to choose the region and are not saved in your character record.</p><section class="panel" style="margin-top:18px"><div class="form"><label class="eyebrow">CHARACTER NAME</label><input id="name" maxlength="18" placeholder="Wayfarer"></div><div class="eyebrow">ORIGIN</div><div class="origin-grid">'+Object.keys({"Vanguard":1,"Ranger":1,"Arcanist":1,"Rogue":1}).map(o=>'<button class="btn origin '+(origin===o?"active":"")+'" data-origin="'+o+'">'+o+'</button>').join("")+'</div><p class="body muted">Vanguard — durable frontliner<br>Ranger — precision and range<br>Arcanist — volatile magic<br>Rogue — speed and opportunism</p><div class="actions"><button class="btn primary" id="enter">'+(pk?"Reconnect Character":"Enter the World")+'</button></div></section></main>'}
function map(){const r=state.region;return '<section class="panel" style="padding:0;overflow:hidden"><div class="map"><div class="road"></div><div class="road two"></div><div class="node you"><div class="orb">◆</div>You</div><div class="node town"><div class="orb">▦</div>Wayfall</div><div class="node signal"><div class="orb">?</div>Signal</div>'+(r.discoveries.length?'<div class="node shrine"><div class="orb">◇</div>Glass Shrine</div>':"")+'</div><div class="mapstats">'+[["Corruption",r.corruption],["Order",r.order],["Prosperity",r.prosperity],["Threat",r.threat]].map(x=>'<div class="stat"><small>'+x[0]+'</small><b>'+x[1]+'%</b></div>').join("")+'</div></section>'}
function meters(){return '<section class="panel"><div class="head"><h2>'+esc(state.name)+'</h2><span class="chip">'+state.origin+' · LV '+state.level+'</span></div><div class="meterline"><span>HP</span><span>'+state.hp+'/'+state.maxHp+'</span></div><div class="bar"><div class="fill" style="width:'+pct(state.hp,state.maxHp)+'%"></div></div><div class="meterline"><span>XP</span><span>'+state.xp+'/'+state.xpNeeded+'</span></div><div class="bar"><div class="fill xp" style="width:'+pct(state.xp,state.xpNeeded)+'%"></div></div></section>'}
function encounter(){if(state.combat){const c=state.combat;return '<section class="panel"><div class="eyebrow">HOSTILE CONTACT</div><div class="head"><h2>'+esc(c.name)+'</h2><span class="chip">TURN '+c.turn+'</span></div><div class="meterline"><span>Enemy HP</span><span>'+c.hp+'/'+c.maxHp+'</span></div><div class="bar"><div class="fill enemy" style="width:'+pct(c.hp,c.maxHp)+'%"></div></div><p class="body muted">'+esc(c.intent)+'</p><div class="actions"><button class="btn primary" data-act="combat" data-type="attack">Attack</button><button class="btn" data-act="combat" data-type="skill">'+esc(state.skill)+'</button><button class="btn" data-act="combat" data-type="guard">Guard</button><button class="btn" data-act="combat" data-type="potion">Tonic</button></div></section>'}if(state.pendingChoice)return '<section class="panel"><div class="eyebrow">WORLD CONSEQUENCE</div><h2 style="margin:5px 0">The Glass Shrine Responds</h2><p class="body muted">This choice changes the region, not only your character.</p><div class="actions"><button class="btn primary" data-choice="cleanse">Cleanse Shrine</button><button class="btn danger" data-choice="bind">Bind Its Power</button></div></section>';const r=state.rumor;return '<section class="panel"><div class="head"><div><div class="eyebrow">ACTIVE RUMOR // '+esc(r?.type||"SIGNAL")+'</div><h2 style="margin-top:5px">'+esc(r?.title||"No signal")+'</h2></div><span class="chip">'+state.gold+'g</span></div><p class="body muted">'+esc(r?.body||"The region is quiet.")+'</p><div class="actions"><button class="btn primary" data-simple="investigate">Investigate</button><button class="btn" data-simple="advance">Advance Day</button></div></section>'}
function world(){return map()+meters()+encounter()+'<section class="panel"><div class="head"><h2>Regional Presence</h2><span class="chip">'+presence.length+' nearby</span></div>'+(presence.length?presence.map(p=>'<div class="item"><b>'+esc(p.name)+'</b><span class="muted">Lv '+p.level+' · '+esc(p.origin)+'</span></div>').join(""):'<p class="body muted">No other testers visible here yet.</p>')+'</section>'}
function inventory(){return '<section class="panel"><div class="eyebrow">GEAR & RELICS</div><h2 style="margin:5px 0 12px">Inventory</h2>'+state.inventory.map(i=>'<div class="item"><div><b>'+esc(i.name)+'</b>'+(i.qty?'<div class="muted">Quantity '+i.qty+'</div>':"")+'</div><span class="rarity">'+esc(i.rarity)+'</span></div>').join("")+'</section>'}
function history(){return '<section class="panel"><div class="eyebrow">REGIONAL RECORD</div><h2 style="margin:5px 0 12px">History</h2><div class="feed">'+(state.region.history.length?state.region.history.map(x=>'<div class="entry">'+esc(x)+'</div>').join(""):'<div class="entry muted">No player has written history here yet.</div>')+'</div></section>'}
function journal(){return '<section class="panel"><div class="eyebrow">FIELD LOG</div><h2 style="margin:5px 0 12px">Recent Events</h2><div class="feed">'+state.feed.map(x=>'<div class="entry">'+esc(x.text)+'</div>').join("")+'</div></section>'}
function render(){if(!state)return startView();return '<main class="shell">'+(notice?'<section class="panel">'+esc(notice)+'</section>':"")+'<header class="top"><div><div class="eyebrow">PROJECT ORDINAL // V0.7</div><h1>'+esc(state.region.name)+'</h1><div class="sub">Day '+state.region.day+' · '+esc(state.region.stage)+' · '+esc(state.region.faction)+'</div></div><span class="chip">'+state.gold+'g</span></header>'+(tab==="world"?world():tab==="inventory"?inventory():tab==="history"?history():journal())+'</main><nav class="bottom"><div class="nav">'+["world","inventory","history","journal"].map(t=>'<button class="'+(tab===t?"active":"")+'" data-tab="'+t+'">'+t[0].toUpperCase()+t.slice(1)+'</button>').join("")+'</div></nav>'}
function draw(){document.querySelector("#app").innerHTML=render();wire()}
function wire(){document.querySelectorAll("[data-origin]").forEach(b=>b.onclick=()=>{origin=b.dataset.origin;draw()});const e=document.querySelector("#enter");if(e)e.onclick=async()=>{try{await start();notice="";draw()}catch(x){notice=x.message;draw()}};document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;draw()});document.querySelectorAll("[data-simple]").forEach(b=>b.onclick=async()=>{try{await act(b.dataset.simple);notice="";draw()}catch(x){notice=x.message;draw()}});document.querySelectorAll("[data-act]").forEach(b=>b.onclick=async()=>{try{await act(b.dataset.act,{type:b.dataset.type});notice="";draw()}catch(x){notice=x.message;draw()}});document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=async()=>{try{await act("choice",{choice:b.dataset.choice});notice="";draw()}catch(x){notice=x.message;draw()}})}
await restore();draw();setInterval(async()=>{if(sid&&state&&!document.hidden){await shared();draw()}},5000);
</script></body></html>
