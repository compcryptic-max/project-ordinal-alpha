name: Native iOS Compile Gate

on:
  push:
    branches: [main]
    paths:
      - "native-ios/**"
      - "!native-ios/**/*.md"
      - "project.yml"
      - "scripts/package-ios.py"
      - ".github/workflows/native-ios.yml"
  workflow_dispatch:

concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Compile Project Ordinal for iPhone Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ProjectOrdinal.xcodeproj \
            -scheme ProjectOrdinal \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee native-ios-build.log

      - name: Compile Project Ordinal for unsigned iPhone device
        run: |
          set -o pipefail
          xcodebuild \
            -project ProjectOrdinal.xcodeproj \
            -scheme ProjectOrdinal \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build-device \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee native-ios-device-build.log

      - name: Package unsigned iPhone app for personal testing
        run: |
          python3 scripts/package-ios.py \
            --app 'build-device/Build/Products/Debug-iphoneos/Project Ordinal.app' \
            --output 'dist/ProjectOrdinal.ipa'
          cp docs/TESTER-HANDOFF.md dist/TESTER-HANDOFF.md
          cp native-ios/FREE-WINDOWS-INSTALL.md dist/FREE-WINDOWS-INSTALL.md
          git rev-parse HEAD > dist/BUILD-COMMIT.txt

      - name: Upload iPhone testing package
        uses: actions/upload-artifact@v4
        with:
          name: ProjectOrdinal-iPhone-unsigned
          path: |
            dist/ProjectOrdinal.ipa
            dist/ProjectOrdinal.ipa.sha256
            dist/TESTER-HANDOFF.md
            dist/FREE-WINDOWS-INSTALL.md
            dist/BUILD-COMMIT.txt
          if-no-files-found: error

      - name: Preserve build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-build-log
          path: |
            native-ios-build.log
            native-ios-device-build.log
          if-no-files-found: ignore
